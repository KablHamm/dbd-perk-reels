# Checks the wiki once a day, refreshes descriptions and icons, and adds any new perks.
# You can also run it by hand from the repository's Actions tab ("Run workflow").
name: Update perks from the wiki

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the wiki
        run: python tools/update_from_wiki.py --add
      - name: Save any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data icons
          git diff --cached --quiet || (git commit -m "Update perks from the wiki" && git push)
